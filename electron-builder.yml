appId: com.huanmeng.map-creator
productName: HuanMeng Map Creator
copyright: HuanMeng Map Creator © 2026 RZOZY · 基于 Azgaar's Fantasy Map Generator（MIT, © 2017-2026 Azgaar and contributors）
directories:
  output: release
  buildResources: build
files:
  - dist-electron/**/*
  - package.json
  - "!node_modules/**/*" # the renderer is bundled by Vite, the main process only needs Electron itself
extraFiles:
  - from: LICENSE
    to: LICENSE
  - from: THIRD-PARTY-NOTICES.md
    to: THIRD-PARTY-NOTICES.md
asar: true
afterPack: ./scripts/adhoc-sign.mjs
artifactName: HuanMengMap-${version}-${os}-${arch}.${ext}
mac:
  category: public.app-category.graphics-design
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
win:
  target:
    - target: nsis
      arch: [x64, arm64]
linux:
  category: Graphics
  maintainer: Azgaar <azgaar.fmg@yandex.com>
  synopsis: Generate and edit fantasy maps
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # otherwise a third installer carrying both architectures is built next to the per-arch ones
  buildUniversalInstaller: false
# 本项目仅手动发布已验证的便携 ZIP；使用 npm run package:portable。
# 不配置 publish provider，不自动上传或生成安装器。
