name: Build Windows portable app

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check product version and asset stamps
        run: |
          node scripts/sync-version.js --check
          node scripts/stamp-assets.js --check

      - name: Run unit and script tests
        run: npm run test:all

      - name: Build portable directory without publishing
        run: npm run package:portable

      - name: Archive portable contents and checksum
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $name = "HuanMengMap-$version-win-x64-portable.zip"
          $zip = Join-Path 'release' $name
          if (Test-Path $zip) { throw 'Archive already exists' }
          Compress-Archive -Path 'release/win-unpacked/*' -DestinationPath $zip
          $sha = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          "$sha  $name" | Set-Content -Encoding ascii (Join-Path 'release' 'SHA256SUMS.txt')

      - name: Upload portable build for manual validation
        uses: actions/upload-artifact@v7
        with:
          name: huanmeng-windows-x64-portable
          if-no-files-found: error
          path: |
            release/HuanMengMap-*-win-x64-portable.zip
            release/SHA256SUMS.txt
